  <body>
    <header class="barra">
      <h1 class="marca" aria-label="Fari Sensei's Battle Royale"><span class="marca-sup">Fari Sensei's</span><span class="marca-titulo">BATTLE ROYALE</span></h1>
      <nav id="nav" class="nav" hidden>
        <button type="button" data-ir="preparacion" data-i18n="nav.participantes">Participantes</button>
        <button type="button" data-ir="eventos" data-i18n="nav.editor">Editor</button>
      </nav>
      <div id="acciones-partida" class="acciones" hidden>
        <span class="seed-actual"><span data-i18n="acc.seed">Seed</span> <code id="seed-actual"></code></span>
        <button type="button" id="repetir" data-i18n="acc.repetir" data-i18n-title="acc.repetir.t">Repetir</button>
        <button type="button" id="otra-seed" data-i18n="acc.otra" data-i18n-title="acc.otra.t">Otra partida</button>
        <button type="button" id="copiar-link" data-i18n="acc.link" data-i18n-title="acc.link.t">Copiar link</button>
        <button type="button" id="editar" data-i18n="acc.editarParticipantes">Participantes</button>
        <button type="button" id="editar-eventos" data-i18n="acc.editarEditor">Editor</button>
      </div>
      <button type="button" id="idioma" class="idioma" data-i18n="idioma.cambiar" data-i18n-title="idioma.titulo">English</button>
    </header>

    <!-- ───────── Preparación ───────── -->
    <main id="pantalla-preparacion" class="preparacion" hidden>
      <div class="prep-cab">
        <div>
          <h2 data-i18n="prep.titulo">Participantes</h2>
          <p id="prep-conteo" class="prep-conteo"></p>
        </div>
        <p class="prep-ayuda" data-i18n="prep.ayuda">
          Los del mismo grupo empiezan como amigos. El rasgo cambia cómo se comportan,
          y el objeto inicial lo llevan desde antes de salir.
        </p>
      </div>

      <div class="prep-herramientas">
        <button type="button" id="prep-agregar" data-i18n="prep.agregar">+ Agregar</button>
        <button type="button" id="prep-pegar" aria-expanded="false" data-i18n="prep.pegar">Pegar lista de nombres</button>
        <button type="button" id="prep-parejas" data-i18n="prep.parejas">Parejas al azar</button>
        <button type="button" id="prep-sin-grupos" data-i18n="prep.sinGrupos">Quitar grupos</button>
        <button type="button" id="prep-rasgos" data-i18n="prep.rasgos">Rasgos al azar</button>
        <button type="button" id="prep-fotos" data-i18n="prep.fotos" data-i18n-title="prep.fotos.t">Agregar fotos</button>
        <button type="button" id="prep-sin-fotos" data-i18n="prep.sinFotos">Quitar fotos</button>
        <button type="button" id="prep-ejemplo" class="discreto" data-i18n="prep.ejemplo">Lista de ejemplo</button>
      </div>

      <div id="prep-pegado" class="prep-pegado" hidden>
        <label for="prep-texto" data-i18n="prep.pegado.et">Un nombre por línea (o separados por comas)</label>
        <textarea id="prep-texto" rows="6" placeholder="Ana&#10;Benja&#10;Cata, Diego, Eli"></textarea>
        <div class="prep-pegado-botones">
          <button type="button" id="prep-pegar-agregar" data-i18n="prep.pegado.agregar">Agregar a la lista</button>
          <button type="button" id="prep-pegar-reemplazar" data-i18n="prep.pegado.reemplazar">Reemplazar la lista</button>
        </div>
      </div>

      <div class="prep-tabla" role="table" aria-label="Participantes" data-i18n-aria="prep.titulo">
        <div class="prep-fila prep-encabezado" role="row">
          <span data-i18n="prep.col.foto">Foto</span><span>#</span><span data-i18n="prep.col.nombre">Nombre</span><span data-i18n="prep.col.grupo">Grupo</span><span data-i18n="prep.col.rasgo">Rasgo</span><span data-i18n="prep.col.objeto">Objeto inicial</span><span></span>
        </div>
        <div id="prep-filas"></div>
      </div>

      <p id="prep-estado" class="prep-estado" role="status"></p>
      <input type="file" id="prep-archivo-foto" accept="image/*" hidden />
      <input type="file" id="prep-archivo-fotos" accept="image/*" multiple hidden />
      <ul id="prep-errores" class="prep-errores"></ul>

      <form id="prep-pie" class="prep-pie">
        <label for="prep-seed" data-i18n="prep.seed">Seed</label>
        <input id="prep-seed" autocomplete="off" spellcheck="false" />
        <button type="button" id="prep-seed-azar" data-i18n-title="prep.seedAzar" title="Seed aleatoria" data-i18n="prep.seedAzar.btn">Azar</button>
        <button type="submit" id="prep-empezar" class="pri" data-i18n="prep.empezar">Empezar</button>
      </form>
    </main>

    <!-- ───────── Editor de eventos ───────── -->
    <main id="pantalla-eventos" class="eventos" hidden>
      <aside class="ev-lista">
        <div id="ed-tabs" class="ed-tabs" role="tablist" aria-label="Qué editar" data-i18n-aria="ed.tabs.aria">
          <button type="button" role="tab" data-col="eventos" data-i18n="ed.tab.eventos">Eventos</button>
          <button type="button" role="tab" data-col="items" data-i18n="ed.tab.items">Objetos</button>
          <button type="button" role="tab" data-col="zonas" data-i18n="ed.tab.zonas">Lugares</button>
        </div>
        <div class="ev-lista-cab">
          <input id="ev-buscar" type="search" placeholder="Buscar eventos…" aria-label="Buscar" data-i18n-aria="ed.buscar.aria" />
          <button type="button" id="ev-nuevo" class="pri" data-i18n="ed.nuevo">+ Nuevo</button>
        </div>
        <div id="ev-items" class="ev-items"></div>
        <div class="ev-lista-pie">
          <button type="button" id="ev-importar" data-i18n="ed.importar" data-i18n-title="ed.importar.t">Importar pack</button>
          <button type="button" id="ev-exportar" data-i18n="ed.exportar" data-i18n-title="ed.exportar.t">Exportar</button>
          <input type="file" id="ev-archivo" accept=".json,application/json" hidden />
        </div>
      </aside>
      <section id="ev-editor" class="ev-editor"></section>
      <p id="ev-aviso" class="ev-aviso" role="status"></p>
    </main>

    <!-- ───────── Partida ───────── -->
    <main id="pantalla-partida" class="layout" hidden>
      <section class="cronica">
        <div id="feed" class="feed" aria-live="polite"></div>
        <div class="controles">
          <div id="progreso" class="progreso"></div>
          <div class="botones">
            <button id="btn-final" class="sec" data-i18n-title="ctl.final.t"><span class="largo" data-i18n="ctl.final">Saltar al final</span><span class="corto" data-i18n="ctl.final.corto">Final</span></button>
            <button id="btn-ronda" class="sec" title="Shift + →"><span class="largo" data-i18n="ctl.ronda">Terminar ronda</span><span class="corto" data-i18n="ctl.ronda.corto">Ronda</span></button>
            <button id="btn-siguiente" class="pri" data-i18n="ctl.siguiente" data-i18n-title="ctl.siguiente.t">Siguiente</button>
          </div>
        </div>
      </section>

      <aside class="panel">
        <div class="panel-cab">
          <h2 data-i18n="panel.titulo">Participantes</h2>
          <span id="vivos" class="vivos"></span>
        </div>
        <p class="nota" data-i18n="panel.nota">Se actualiza al cerrar cada ronda.</p>
        <div id="prohibidas" class="prohibidas" hidden></div>
        <ol id="participantes" class="participantes"></ol>
      </aside>
    </main>

  </body>
</html>
